<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="LuKun Zhang — cross-domain deepfake detection, Beijing Jiaotong University">
  <title>LuKun Zhang — cross-domain deepfake detection</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101c2e"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 38px; font-weight: 700; fill: #e6edf3; }
    .role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 16.5px; font-weight: 600; fill: #2dd4bf; }
    .inst { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 13.5px; fill: #8b949e; }

    /* edges draw themselves, centre -> leaf, staggered */
    .edge { stroke: #2dd4bf; stroke-width: 1.6; fill: none;
            stroke-dasharray: 62; stroke-dashoffset: 62; opacity: 0;
            animation: draw 3.6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes draw {
      0%   { stroke-dashoffset: 62; opacity: 0; }
      12%  { opacity: .85; }
      45%  { stroke-dashoffset: 0; opacity: .85; }
      72%  { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 62; opacity: 0; }
    }

    /* nodes breathe */
    .node { fill: #2dd4bf; opacity: .35; transform-box: fill-box; transform-origin: center;
            animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { opacity: .3;  transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.55); }
    }
    .hub { fill: #60a5fa; opacity: .5; transform-box: fill-box; transform-origin: center;
           animation: breathe 3.6s ease-in-out infinite; }

    /* travelling highlight on the rule */
    .scan { animation: sweep 3.6s ease-in-out infinite; }
    @keyframes sweep {
      0%, 100% { transform: translateX(0);     opacity: .3; }
      50%      { transform: translateX(300px); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .edge, .node, .hub, .scan { animation: none; }
      .edge { stroke-dashoffset: 0; opacity: .5; }
      .node, .hub { opacity: .65; }
      .scan { opacity: .55; }
    }
  </style>

  <rect x="0.75" y="0.75" width="878.5" height="198.5" rx="14" fill="url(#bg)"
        stroke="#1f2a3a" stroke-width="1.5"/>

  <text class="name" x="56" y="82">LuKun Zhang</text>
  <text class="role" x="56" y="118">Cross-domain deepfake detection</text>
  <text class="inst" x="56" y="143">Beijing Jiaotong University</text>

  <rect x="56" y="166" width="364" height="3" rx="1.5" fill="#1f2a3a"/>
  <rect class="scan" x="56" y="166" width="64" height="3" rx="1.5" fill="url(#rule)"/>

  <g>
    <circle class="node" cx="690.0" cy="38.0"  r="4.5" style="animation-delay:0s"/>
    <circle class="node" cx="738.5" cy="61.3"  r="4.5" style="animation-delay:.16s"/>
    <circle class="node" cx="750.4" cy="113.8" r="4.5" style="animation-delay:.32s"/>
    <circle class="node" cx="716.9" cy="155.9" r="4.5" style="animation-delay:.48s"/>
    <circle class="node" cx="663.1" cy="155.9" r="4.5" style="animation-delay:.64s"/>
    <circle class="node" cx="629.6" cy="113.8" r="4.5" style="animation-delay:.8s"/>
    <circle class="node" cx="641.5" cy="61.3"  r="4.5" style="animation-delay:.96s"/>
    <circle class="hub"  cx="690"   cy="100"   r="6"   style="animation-delay:.08s"/>
  </g>

  <g>
    <path class="edge" d="M690 100 L690.0 38.0"  style="animation-delay:0s"/>
    <path class="edge" d="M690 100 L738.5 61.3"  style="animation-delay:.13s"/>
    <path class="edge" d="M690 100 L750.4 113.8" style="animation-delay:.26s"/>
    <path class="edge" d="M690 100 L716.9 155.9" style="animation-delay:.39s"/>
    <path class="edge" d="M690 100 L663.1 155.9" style="animation-delay:.52s"/>
    <path class="edge" d="M690 100 L629.6 113.8" style="animation-delay:.65s"/>
    <path class="edge" d="M690 100 L641.5 61.3"  style="animation-delay:.78s"/>
  </g>
</svg>
